<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #c0c0c0; }
.win98 {
  --face: #c0c0c0;
  --dark: #808080;
  --darker: #0a0a0a;
  --light: #ffffff;
  --lighter: #dfdfdf;
  --titlebar: linear-gradient(90deg, #000080, #1084d0);
  --selected: #000080;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  background: var(--face);
  font-family: Tahoma, "Segoe UI", "MS Sans Serif", Arial, sans-serif;
  font-size: 12px;
  color: #000;
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  overflow: hidden;
}
.win98 * { box-sizing: border-box; }
.win98-window {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: var(--face);
  border: none;
  box-shadow: none;
  display: flex;
  flex-direction: column;
}
.win98-titlebar {
  background: var(--titlebar);
  color: #fff;
  font-weight: bold;
  font-size: 13px;
  padding: 3px 4px 3px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.win98-title-btns { display: flex; gap: 2px; }
.win98-title-btn {
  width: 16px; height: 14px;
  background: var(--face);
  border: 1px outset var(--face);
  font-size: 9px;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}
.win98-menubar {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--dark);
  background: var(--face);
  padding: 2px;
  flex-shrink: 0;
}
.win98-tab {
  flex: 1;
  padding: 5px 4px;
  background: var(--face);
  border: 2px outset var(--face);
  font-size: 12px;
  cursor: pointer;
  text-align: center;
}
.win98-tab.active {
  border-style: inset;
  background: #d4d0c8;
}
.win98-body {
  padding: 8px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  background: var(--face);
  -webkit-overflow-scrolling: touch;
}
.win98-collage {
  position: relative;
  width: 100%;
  border: 2px inset var(--face);
  background: #ffffff;
  overflow: hidden;
  touch-action: none;
}
.win98-collage-img {
  position: absolute;
  left: 50%;
  object-fit: contain;
  max-width: 78%;
  user-select: none;
}
.win98-collage-img.draggable {
  cursor: grab;
  touch-action: none;
}
.win98-collage-img.draggable:active { cursor: grabbing; }
.win98-collage-hint { font-size: 11px; color: #444; margin-top: 4px; font-style: italic; }
.win98-dialog-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.win98-dialog {
  width: 260px;
  background: var(--face);
  border: 2px outset var(--face);
}
.win98-dialog-large { width: min(90vw, 380px); }
.win98-dialog-title {
  background: var(--titlebar);
  color: #fff;
  font-weight: bold;
  padding: 3px 4px 3px 6px;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.win98-dialog-body { padding: 14px 10px; font-size: 12px; }
.win98-dialog-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 0 10px 10px; }
.win98-statusbar {
  border-top: 1px solid var(--light);
  padding: 3px 6px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.win98-status-cell {
  border: 1px inset var(--face);
  padding: 1px 6px;
  background: var(--face);
}
.win98-status-tag { margin-left: auto; color: #444; }
.win98-group {
  border: 2px groove #a0a0a0;
  padding: 10px 8px 8px;
  margin-bottom: 10px;
  position: relative;
}
.win98-legend {
  position: absolute;
  top: -9px;
  left: 8px;
  background: var(--face);
  padding: 0 4px;
  font-weight: bold;
}
.win98-btn {
  background: var(--face);
  border: 2px outset var(--face);
  font-family: inherit;
  font-size: 12px;
  padding: 5px 12px;
  cursor: pointer;
  color: #000;
}
.win98-btn:active { border-style: inset; }
.win98-btn:disabled { color: #808080; cursor: default; }
.win98-btn.primary { font-weight: bold; }
.win98-btn.small { padding: 2px 6px; font-size: 11px; }
.win98-input, .win98-select {
  border: 2px inset var(--face);
  background: #fff;
  font-family: inherit;
  font-size: 12px;
  padding: 4px 5px;
  width: 100%;
}
.win98-field-row { display: flex; gap: 6px; margin-bottom: 6px; }
.win98-upload-box {
  width: 90px; height: 90px;
  border: 2px inset var(--face);
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  overflow: hidden;
  font-size: 10px;
  text-align: center;
  color: #555;
}
.win98-upload-box img { width: 100%; height: 100%; object-fit: cover; }
.win98-thumb-wrap { position: relative; }
.win98-thumb {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 2px inset var(--face);
  background: #fff;
  display: block;
}
.win98-thumb.selected { border: 2px inset var(--selected); box-shadow: 0 0 0 2px var(--selected) inset; }
.win98-thumb-del {
  position: absolute; top: 2px; right: 2px;
  width: 16px; height: 16px;
  background: var(--face);
  border: 1px outset var(--face);
  font-size: 10px; line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.win98-badge {
  display: inline-block;
  border: 1px solid var(--dark);
  background: var(--face);
  font-size: 10px;
  padding: 1px 5px;
  margin: 2px 3px 2px 0;
  font-family: "Courier New", monospace;
}
.win98-select-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,128,0.35);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold;
  font-size: 18px;
}
.win98-checkbox-row { display: flex; align-items: center; gap: 4px; margin: 3px 8px 3px 0; }
.win98-checkbox-row input { accent-color: #000080; width: 13px; height: 13px; }
.win98-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.win98-empty { color: #444; font-style: italic; padding: 20px 4px; text-align: center; }

/* GEÄNDERT: TOAST NACH UNTEN VERSETZT */
.win98-toast {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  background: var(--face); border: 2px outset var(--face);
  padding: 6px 14px; font-size: 12px; z-index: 999;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.25);
}

.win98-outfit-card { border: 2px groove #a0a0a0; padding: 8px; margin-bottom: 0; cursor: pointer; }
.win98-outfit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 4px; }
.win98-outfit-title { font-weight: bold; overflow-wrap: anywhere; }
.win98-outfits-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}
</style>

<body>
<div id="app"></div>

<script>
"use strict";

var CATEGORIES = [
  { id: "oben", label: "Oberteil" },
  { id: "unten", label: "Hose" },
  { id: "jacke", label: "Jacke/Mantel" },
  { id: "schuhe", label: "Schuhe" },
  { id: "acc", label: "Accessoire" },
];
var DEFAULT_TAGS = ["Casual", "Design", "Assi", "Chic", "Übergang", "Sommer", "Winter"];
var STORAGE_KEY = "wardrobe-data";
var STACK_ORDER = ["schuhe", "unten", "oben", "jacke", "acc"];
var COLLAGE_POS = {
  schuhe: { top: 76, height: 24 },
  unten: { top: 40, height: 56 },
  oben: { top: 16, height: 46 },
  jacke: { top: 10, height: 52 },
  acc: { top: 0, height: 20 },
};

var state = {
  pieces: [],
  outfits: [],
  tab: "outfits",
  toast: "",
  newImage: null,
  newCategory: CATEGORIES[0].id,
  newName: "",
  uploading: false,
  selectedIds: [],
  outfitName: "",
  outfitTags: [],
  customTag: "",
  builderLayout: {},
  filterTag: "Alle",
  viewOutfit: null,
  pendingImport: null,
};

function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function categoryLabel(id) {
  var c = CATEGORIES.find(function (c) { return c.id === id; });
  return c ? c.label : id;
}

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      state.pieces = parsed.pieces || [];
      state.outfits = parsed.outfits || [];
    }
  } catch (e) { }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ pieces: state.pieces, outfits: state.outfits }));
  } catch (e) {
    showToast("Speichern fehlgeschlagen (Speicher voll?)");
  }
}

var toastTimer = null;
function showToast(msg) {
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { state.toast = ""; render(); }, 1800);
}

function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var maxDim = 480;
        var width = img.width, height = img.height;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        var canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getPiece(id) { return state.pieces.find(function (p) { return p.id === id; }); }
function allTags() {
  var set = DEFAULT_TAGS.slice();
  state.outfits.forEach(function (o) {
    o.tags.forEach(function (t) { if (set.indexOf(t) === -1) set.push(t); });
  });
  return set;
}

/* ---------- actions ---------- */

function setTab(t) { state.tab = t; render(); }

function handleFileInput(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  state.uploading = true;
  render();
  compressImage(file).then(function (dataUrl) {
    state.newImage = dataUrl;
    state.uploading = false;
    render();
  }).catch(function () {
    state.uploading = false;
    showToast("Bild konnte nicht gelesen werden");
  });
}

function addPiece() {
  if (!state.newImage) return;
  var piece = {
    id: "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
    image: state.newImage,
    category: state.newCategory,
    name: (state.newName || "").trim(),
  };
  state.pieces.push(piece);
  persist();
  state.newImage = null;
  state.newName = "";
  showToast("Teil hinzugefügt");
}

function deletePiece(id) {
  state.pieces = state.pieces.filter(function (p) { return p.id !== id; });
  state.outfits = state.outfits
    .map(function (o) { return Object.assign({}, o, { pieceIds: o.pieceIds.filter(function (pid) { return pid !== id; }) }); })
    .filter(function (o) { return o.pieceIds.length > 0; });
  state.selectedIds = state.selectedIds.filter(function (pid) { return pid !== id; });
  persist();
  render();
}

function togglePiece(id) {
  var i = state.selectedIds.indexOf(id);
  if (i === -1) state.selectedIds.push(id); else state.selectedIds.splice(i, 1);
  render();
}

function clearSelection() {
  state.selectedIds = [];
  state.builderLayout = {};
  render();
}

function saveOutfit() {
  if (state.selectedIds.length === 0) return;
  var name = document.getElementById("outfitNameInput");
  var nameVal = name ? name.value.trim() : "";
  var tagBoxes = document.querySelectorAll(".outfit-tag-checkbox");
  var tags = [];
  tagBoxes.forEach(function (cb) { if (cb.checked) tags.push(cb.value); });
  var outfit = {
    id: "o_" + Date.now(),
    name: nameVal || ("Outfit " + (state.outfits.length + 1)),
    tags: tags,
    pieceIds: state.selectedIds.slice(),
    layout: Object.assign({}, state.builderLayout),
  };
  state.outfits.push(outfit);
  persist();
  state.selectedIds = [];
  state.builderLayout = {};
  state.customTag = "";
  showToast("Outfit gespeichert");
  state.tab = "outfits";
  render();
}

function addCustomTagToPanel() {
  var input = document.getElementById("customTagInput");
  var val = input ? input.value.trim() : "";
  if (!val) return;
  input.value = "";
  var wrap = document.getElementById("outfitTagsWrap");
  if (wrap && !wrap.querySelector('input[value="' + val.replace(/"/g, "") + '"]')) {
    var label = document.createElement("label");
    label.className = "win98-checkbox-row";
    label.innerHTML = '<input type="checkbox" class="outfit-tag-checkbox" value="' + esc(val) + '" checked /> ' + esc(val);
    wrap.appendChild(label);
  }
}

function deleteOutfit(id) {
  state.outfits = state.outfits.filter(function (o) { return o.id !== id; });
  persist();
  render();
}

function setFilterTag(t) { state.filterTag = t; render(); }

function openViewOutfit(id) {
  state.viewOutfit = state.outfits.find(function (o) { return o.id === id; }) || null;
  render();
}
function closeViewOutfit() { state.viewOutfit = null; render(); }

function randomizeSelection() {
  var picks = [];
  CATEGORIES.forEach(function (cat) {
    var catPieces = state.pieces.filter(function (p) { return p.category === cat.id; });
    if (catPieces.length > 0) picks.push(catPieces[Math.floor(Math.random() * catPieces.length)]);
  });
  state.selectedIds = picks.map(function (p) { return p.id; });
  state.builderLayout = {};
  render();
}

function handleExport() {
  var payload = JSON.stringify({ pieces: state.pieces, outfits: state.outfits, exportedAt: new Date().toISOString() });
  var dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(payload);
  var a = document.createElement("a");
  a.href = dataUri;
  a.download = "kleiderschrank-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast("Backup heruntergeladen");
}

function handleImportInput(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    try {
      var parsed = JSON.parse(ev.target.result);
      if (!parsed || !Array.isArray(parsed.pieces) || !Array.isArray(parsed.outfits)) throw new Error("invalid");
      state.pendingImport = parsed;
      render();
    } catch (e) {
      showToast("Datei ungültig");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function confirmImport() {
  if (!state.pendingImport) return;
  state.pieces = state.pendingImport.pieces;
  state.outfits = state.pendingImport.outfits;
  persist();
  state.pendingImport = null;
  showToast("Daten importiert");
  render();
}
function cancelImport() { state.pendingImport = null; render(); }

/* ---------- DRAG & SCALE (PINCH-TO-ZOOM) ---------- */

function startDrag(e, pieceId) {
  e.preventDefault();
  
  var base = state.builderLayout[pieceId] || { dx: 0, dy: 0, scale: 1 };
  if (base.scale === undefined) base.scale = 1;
  
  var baseX = base.dx || 0, baseY = base.dy || 0;
  var baseScale = base.scale;
  var imgEl = e.currentTarget;

  // Wenn zwei Finger auf dem Display liegen -> Geste für Skalierung starten
  if (e.touches && e.touches.length === 2) {
    var startDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    function onPinchMove(ev) {
      if (ev.touches && ev.touches.length === 2) {
        var curDist = Math.hypot(
          ev.touches[0].clientX - ev.touches[1].clientX,
          ev.touches[0].clientY - ev.touches[1].clientY
        );
        var newScale = baseScale * (curDist / startDist);
        if (newScale < 0.3) newScale = 0.3; // Min-Zoom
        if (newScale > 3.0) newScale = 3.0; // Max-Zoom
        
        imgEl.style.transform = "translate(calc(-50% + " + baseX + "px), " + baseY + "px) scale(" + newScale + ")";
        state.builderLayout[pieceId].scale = newScale;
      }
    }

    function onPinchUp() {
      window.removeEventListener("touchmove", onPinchMove);
      window.removeEventListener("touchend", onPinchUp);
    }

    window.addEventListener("touchmove", onPinchMove, { passive: false });
    window.addEventListener("touchend", onPinchUp);
    return;
  }

  // Normaler 1-Finger Drag zum Verschieben
  var point = e.touches ? e.touches[0] : e;
  var startX = point.clientX, startY = point.clientY;

  function onMove(ev) {
    var p2 = ev.touches ? ev.touches[0] : ev;
    var dx = baseX + (p2.clientX - startX);
    var dy = baseY + (p2.clientY - startY);
    
    imgEl.style.transform = "translate(calc(-50% + " + dx + "px), " + dy + "px) scale(" + (state.builderLayout[pieceId].scale || 1) + ")";
    state.builderLayout[pieceId].dx = dx;
    state.builderLayout[pieceId].dy = dy;
  }

  function onUp() {
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    window.removeEventListener("touchmove", onMove);
    window.removeEventListener("touchend", onUp);
  }

  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp);
}
window.startDrag = startDrag;

/* ---------- rendering ---------- */

function collageHtml(items, layout, editable, isThumb) {
  layout = layout || {};
  var byCat = {};
  items.forEach(function (p) { (byCat[p.category] = byCat[p.category] || []).push(p); });
  var imgs = "";
  var factor = isThumb ? 0.46 : 1.0;
  
  STACK_ORDER.forEach(function (catId, idx) {
    (byCat[catId] || []).forEach(function (p) {
      var off = layout[p.id] || { dx: 0, dy: 0, scale: 1 };
      var dx = (off.dx || 0) * factor;
      var dy = (off.dy || 0) * factor;
      var currentScale = off.scale !== undefined ? off.scale : 1;

      var pos = "top:" + COLLAGE_POS[catId].top + "%;height:" + COLLAGE_POS[catId].height + "%;z-index:" + (idx + 1) +
        ";transform:translate(calc(-50% + " + dx + "px), " + dy + "px) scale(" + currentScale + ");";
      var cls = "win98-collage-img" + (editable ? " draggable" : "");
      var handlers = editable ? " onmousedown=\"startDrag(event,'" + p.id + "')\" ontouchstart=\"startDrag(event,'" + p.id + "')\"" : "";
      imgs += '<img src="' + p.image + '" alt="' + esc(categoryLabel(catId)) + '" draggable="false" class="' + cls + '" style="' + pos + '"' + handlers + " />";
    });
  });
  var empty = items.length === 0 ? '<div class="win98-empty">Keine Teile ausgewählt.</div>' : "";
  return '<div class="win98-collage" style="aspect-ratio:3/4">' + empty + imgs + "</div>";
}

function renderSchrank() {
  var html = '<div class="win98-group"><div class="win98-legend">Neues Teil</div><div style="display:flex;gap:8px">';
  html += '<label class="win98-upload-box">';
  if (state.newImage) html += '<img src="' + state.newImage + '" alt="Vorschau" />';
  else if (state.uploading) html += "...";
  else html += "Foto wählen";
  html += '<input type="file" accept="image/*" style="display:none" onchange="handleFileInput(this)" /></label>';
  html += '<div style="flex:1"><div class="win98-field-row"><select class="win98-select" onchange="state.newCategory=this.value">';
  CATEGORIES.forEach(function (c) {
    html += '<option value="' + c.id + '"' + (state.newCategory === c.id ? " selected" : "") + ">" + esc(c.label) + "</option>";
  });
  html += '</select></div><div class="win98-field-row"><input class="win98-input" type="text" placeholder="Name (optional)" value="' + esc(state.newName) + '" oninput="state.newName=this.value" /></div>';
  html += '<button class="win98-btn primary" style="width:100%" ' + (state.newImage ? "" : "disabled") + ' onclick="addPiece()">+ Hinzufügen</button></div></div></div>';

  CATEGORIES.forEach(function (cat) {
    var items = state.pieces.filter(function (p) { return p.category === cat.id; });
    if (items.length === 0) return;
    html += '<div style="margin-bottom:12px"><span class="win98-badge">' + esc(cat.label) + " (" + items.length + ')</span><div class="win98-grid3" style="margin-top:6px">';
    items.forEach(function (p) {
      html += '<div class="win98-thumb-wrap"><img class="win98-thumb" src="' + p.image + '" alt="' + esc(p.name || cat.label) + '" />';
      html += '<div class="win98-thumb-del" onclick="deletePiece(\'' + p.id + "')\">×</div></div>";
    });
    html += "</div></div>";
  });

  if (state.pieces.length === 0) html += '<div class="win98-empty">Noch keine Teile im Schrank.</div>';

  html += '<div class="win98-field-row" style="margin-top:4px">';
  html += '<button class="win98-btn small" style="flex:1" onclick="handleExport()">Backup ↓</button>';
  html += '<label class="win98-btn small" style="flex:1;text-align:center">Backup ↑<input type="file" accept="application/json" style="display:none" onchange="handleImportInput(this)" /></label>';
  html += "</div>";
  return html;
}

function renderBauen() {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  html += "<span>Klicke Teile an, um sie zu kombinieren.</span>";
  html += '<button class="win98-btn small" ' + (state.pieces.length === 0 ? "disabled" : "") + ' onclick="randomizeSelection()">🎲 Zufall</button></div>';

  if (state.selectedIds.length > 0) {
    var selPieces = state.selectedIds.map(getPiece).filter(Boolean);
    html += '<div class="win98-group" style="margin-top:4px"><div class="win98-legend">Collage</div>';
    html += collageHtml(selPieces, state.builderLayout, true, false);
    html += '<div class="win98-collage-hint">Teile lassen sich ziehen & mit 2 Fingern skalieren.</div></div>';

    html += '<div class="win98-group"><div class="win98-legend">Outfit speichern (' + state.selectedIds.length + ' Teile)</div>';
    html += '<div class="win98-field-row"><input id="outfitNameInput" class="win98-input" type="text" placeholder="Name (optional)" /></div>';
    html += '<div id="outfitTagsWrap" style="display:flex;flex-wrap:wrap;margin-bottom:6px">';
    allTags().forEach(function (t) {
      html += '<label class="win98-checkbox-row"><input type="checkbox" class="outfit-tag-checkbox" value="' + esc(t) + '" /> ' + esc(t) + "</label>";
    });
    html += "</div>";
    html += '<div class="win98-field-row"><input id="customTagInput" class="win98-input" type="text" placeholder="Eigener Tag..." onkeydown="if(event.key===\'Enter\')addCustomTagToPanel()" /><button class="win98-btn" onclick="addCustomTagToPanel()">+</button></div>';
    html += '<div style="display:flex;gap:6px"><button class="win98-btn" style="flex:1" onclick="clearSelection()">Auswahl leeren</button><button class="win98-btn primary" style="flex:1" onclick="saveOutfit()">Speichern</button></div>';
    html += "</div>";
  }

  if (state.pieces.length === 0) html += '<div class="win98-empty">Füge zuerst Teile im Schrank hinzu.</div>';

  html += '<div class="win98-grid3">';
  state.pieces.forEach(function (p) {
    var selected = state.selectedIds.indexOf(p.id) !== -1;
    html += '<div class="win98-thumb-wrap" style="cursor:pointer" onclick="togglePiece(\'' + p.id + "')\">";
    html += '<img class="win98-thumb' + (selected ? " selected" : "") + '" src="' + p.image + '" alt="' + esc(p.name) + '" />';
    if (selected) html += '<div class="win98-select-overlay">✓</div>';
    html += "</div>";
  });
  html += "</div>";

  return html;
}

function renderOutfits() {
  var tags = ["Alle"].concat(allTags());
  var html = '<div style="display:flex;flex-wrap:wrap;margin-bottom:10px">';
  tags.forEach(function (t) {
    var active = state.filterTag === t;
    html += '<button class="win98-btn small" style="margin-right:4px;margin-bottom:4px;border-style:' + (active ? "inset" : "outset") + '" onclick="setFilterTag(\'' + t.replace(/'/g, "\\'") + "')\">" + esc(t) + "</button>";
  });
  html += "</div>";

  var visible = state.filterTag === "Alle" ? state.outfits : state.outfits.filter(function (o) { return o.tags.indexOf(state.filterTag) !== -1; });

  if (visible.length === 0) {
    html += '<div class="win98-empty">Keine Outfits ' + (state.filterTag !== "Alle" ? "mit „" + esc(state.filterTag) + "“" : "gespeichert") + ".</div>";
  }

  html += '<div class="win98-outfits-grid">';
  visible.forEach(function (o) {
    html += '<div class="win98-outfit-card" onclick="openViewOutfit(\'' + o.id + '\')"><div class="win98-outfit-head"><span class="win98-outfit-title">' + esc(o.name) + '</span>';
    html += '<button class="win98-btn small" onclick="event.stopPropagation();deleteOutfit(\'' + o.id + '\')">Löschen</button></div><div style="margin-bottom:6px">';
    o.tags.forEach(function (t) { html += '<span class="win98-badge">' + esc(t) + "</span>"; });
    html += "</div>";
    html += collageHtml(o.pieceIds.map(getPiece).filter(Boolean), o.layout || {}, false, true);
    html += "</div>";
  });
  html += "</div>";
  return html;
}

function render() {
  var bodyEl = document.querySelector(".win98-body");
  var savedScrollTop = bodyEl ? bodyEl.scrollTop : 0;

  var body = state.tab === "schrank" ? renderSchrank() : state.tab === "bauen" ? renderBauen() : renderOutfits();

  var html = '<div class="win98"><div class="win98-window">';
  html += '<div class="win98-titlebar"><span>fit-generator-3000</span><div class="win98-title-btns"><div class="win98-title-btn">_</div><div class="win98-title-btn">□</div><div class="win98-title-btn">×</div></div></div>';
  html += '<div class="win98-menubar">';
  ["outfits", "schrank", "bauen"].forEach(function (t) {
    var label = t === "outfits" ? "Outfits" : t === "schrank" ? "Schrank" : "Bauen";
    html += '<div class="win98-tab' + (state.tab === t ? " active" : "") + '" onclick="setTab(\'' + t + "')\">" + label + "</div>";
  });
  html += "</div>";

  if (state.toast) html += '<div class="win98-toast">' + esc(state.toast) + "</div>";

  html += '<div class="win98-body">' + body + "</div>";

  html += '<div class="win98-statusbar"><div class="win98-status-cell">' + state.pieces.length + ' Teile</div><div class="win98-status-cell">' + state.outfits.length + ' Outfits</div><span class="win98-status-tag">v.01 2026</span></div>';
  html += "</div>";

  if (state.viewOutfit) {
    var o = state.viewOutfit;
    html += '<div class="win98-dialog-overlay" onclick="closeViewOutfit()"><div class="win98-dialog win98-dialog-large" onclick="event.stopPropagation()">';
    html += '<div class="win98-dialog-title"><span>' + esc(o.name) + '</span><div class="win98-title-btn" onclick="closeViewOutfit()">×</div></div>';
    html += '<div class="win98-dialog-body"><div style="margin-bottom:8px">';
    o.tags.forEach(function (t) { html += '<span class="win98-badge">' + esc(t) + "</span>"; });
    html += "</div>";
    html += collageHtml(o.pieceIds.map(getPiece).filter(Boolean), o.layout || {}, false, false);
    html += '</div><div class="win98-dialog-actions"><button class="win98-btn" onclick="closeViewOutfit()">Schließen</button></div></div></div>';
  }

  if (state.pendingImport) {
    html += '<div class="win98-dialog-overlay"><div class="win98-dialog">';
    html += '<div class="win98-dialog-title"><span>Import bestätigen</span></div>';
    html += '<div class="win98-dialog-body">Gefunden: ' + state.pendingImport.pieces.length + " Teile, " + state.pendingImport.outfits.length + " Outfits.<br />Das ersetzt deine aktuellen Daten. Fortfahren?</div>";
    html += '<div class="win98-dialog-actions"><button class="win98-btn" onclick="cancelImport()">Abbrechen</button><button class="win98-btn primary" onclick="confirmImport()">Ja, ersetzen</button></div>';
    html += "</div></div>";
  }

  html += "</div>";
  document.getElementById("app").innerHTML = html;

  var newBodyEl = document.querySelector(".win98-body");
  if (newBodyEl) {
    newBodyEl.scrollTop = savedScrollTop;
  }
}

load();
render();
</script>
</body>
</html>
